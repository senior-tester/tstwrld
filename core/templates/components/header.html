<header class="sticky top-0 z-40 bg-white/80 dark:bg-gray-950/80 backdrop-blur-sm border-b border-gray-200 dark:border-gray-800">
    <div class="max-w-full px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <span class="text-xl font-semibold text-gray-900 dark:text-gray-100">QA Toolkit</span>
            <span class="px-2 py-0.5 text-xs font-medium uppercase tracking-wider bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-400 rounded">v0.1.0-alpha</span>
        </div>
        <div class="flex items-center gap-4">
            <button
                @click="toggleTheme()"
                :aria-pressed="isDark"
                :aria-label="isDark ? 'Switch to light mode' : 'Switch to dark mode'"
                class="p-2 rounded-lg bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors"
            >
                <span x-show="!isDark" class="text-lg" aria-hidden="true">🌙</span>
                <span x-show="isDark" class="text-lg" aria-hidden="true">☀️</span>
            </button>
            <a
                href="https://github.com/senior-tester/tstwrld"
                target="_blank"
                rel="noopener noreferrer"
                class="text-sm text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200 transition-colors"
            >
                GitHub
            </a>
        </div>
    </div>
</header>
